<!DOCTYPE html><html class="dark" lang="vi"><head>

                    "on-tertiary": "#68000b",

                    "on-secondary-fixed-variant": "#394d00",

            "fontFamily": {

            },
            "fontSize": {
                    "label-status": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0f1418;
            color: #dfe3e9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .clock-face {
            aspect-ratio: 1/1;
            background: radial-gradient(circle at center, #1b2025 0%, #0a0f13 100%);
            border: 1px solid rgba(140, 146, 141, 0.1);
        }
        .clock-hand {
            transform-origin: bottom center;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .number-marker {
            position: absolute;
            transform: translate(-50%, -50%);
        }
        .glass-card {
            backdrop-filter: blur(12px);
            background: rgba(27, 32, 37, 0.7);
            border: 1px solid rgba(177, 205, 187, 0.1);
        }
        .progress-bar-fill {
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Top Progress Header -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl px-container-margin h-16 flex items-center justify-between border-b border-outline-variant/10">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex-1 px-4">
<div class="h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-secondary progress-bar-fill" style="width: 75%;"></div>
</div>
</div>
<span class="font-label-status text-label-status text-on-surface-variant">Bước 6/8</span>
</header>
<main class="flex-1 flex flex-col items-center pt-24 pb-12 px-container-margin max-w-lg mx-auto w-full">
<!-- Headline -->
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm leading-tight">
                Bạn thường phải dậy lúc mấy giờ để đi học? ⏰
            </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Thiết lập giờ giấc cơ bản
            </p>
</div>
<!-- Time Picker Container -->
<div class="w-full flex flex-col items-center">
<!-- Digital Readout -->
<div class="mb-10 text-center">
<div class="font-headline-lg text-headline-lg text-secondary tracking-widest bg-secondary-container/10 px-6 py-2 rounded-xl border border-secondary/20" id="time-display">
                    06:30 AM
                </div>
</div>
<!-- Analog Clock Selector -->
<div class="relative w-full max-w-[280px] clock-face rounded-full shadow-2xl flex items-center justify-center cursor-pointer select-none" id="clock-container">
<!-- Hour Markers -->
<div class="absolute inset-4 rounded-full border border-outline/5 pointer-events-none"></div>
<!-- Numbers -->
<div class="absolute inset-0 w-full h-full p-6 pointer-events-none" id="clock-numbers"></div>
<!-- Clock Hand -->
<div class="clock-hand absolute bottom-1/2 left-1/2 w-1.5 h-[35%] bg-secondary rounded-full origin-bottom" id="clock-hand" style="transform: translateX(-50%) rotate(195deg);">
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-8 h-8 bg-secondary rounded-full shadow-lg shadow-secondary/40 flex items-center justify-center">
<div class="w-2 h-2 bg-on-secondary rounded-full"></div>
</div>
</div>
<!-- Center Point -->
<div class="w-4 h-4 bg-secondary rounded-full z-10 shadow-sm border-2 border-background"></div>
</div>
<!-- AM/PM Toggle -->
<div class="flex mt-10 p-1 bg-surface-container rounded-xl gap-1 w-full max-w-[200px]">
<button class="flex-1 py-2 rounded-lg font-label-status text-label-status bg-secondary text-on-secondary transition-all" id="btn-am">AM</button>
<button class="flex-1 py-2 rounded-lg font-label-status text-label-status text-on-surface-variant hover:text-on-surface transition-all" id="btn-pm">PM</button>
</div>
</div>
<!-- Insight Card -->
<div class="mt-12 glass-card p-4 rounded-xl flex items-start gap-4 w-full">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                GoClock sẽ đề xuất giờ đi ngủ tối ưu dựa trên giờ thức dậy của bạn.
            </p>
</div>
<!-- Primary Action -->
<button class="mt-auto w-full h-14 bg-secondary text-on-secondary font-headline-md text-headline-md rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-lg shadow-secondary/20">
            Tiếp tục
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</main>
<!-- Visual Atmosphere -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -z-10 w-full h-full pointer-events-none opacity-20">

</div>
<script>
        const clockContainer = document.getElementById('clock-container');
        const clockHand = document.getElementById('clock-hand');
        const timeDisplay = document.getElementById('time-display');
        const btnAm = document.getElementById('btn-am');
        const btnPm = document.getElementById('btn-pm');
        const clockNumbers = document.getElementById('clock-numbers');

        let isAm = true;
        let currentAngle = 195; // Initial 6:30 position (180 + 15)
        let isDragging = false;

        // Populate Numbers
        for (let i = 1; i <= 12; i++) {
            const angle = (i * 30) * (Math.PI / 180);
            const radius = 105;
            const x = Math.sin(angle) * radius;
            const y = -Math.cos(angle) * radius;
            
            const num = document.createElement('div');
            num.className = 'number-marker font-label-caps text-label-caps text-on-surface-variant';
            num.style.left = `calc(50% + ${x}px)`;
            num.style.top = `calc(50% + ${y}px)`;
            num.textContent = i;
            clockNumbers.appendChild(num);
        }

        function updateTime() {
            // Normalize angle to 0-360
            let normalizedAngle = currentAngle % 360;
            if (normalizedAngle < 0) normalizedAngle += 360;

            // Calculate hours and minutes
            // 360 degrees = 12 hours (720 minutes for total revolution)
            // Simplified: 1 degree = 2 minutes
            let totalMinutes = Math.round(normalizedAngle * 2);
            let hours = Math.floor(totalMinutes / 60);
            let minutes = totalMinutes % 60;

            // Snap minutes to 5 min intervals for better UX
            minutes = Math.round(minutes / 5) * 5;
            if (minutes === 60) {
                minutes = 0;
                hours += 1;
            }
            
            if (hours === 0) hours = 12;
            if (hours > 12) hours -= 12;

            const hourStr = hours.toString().padStart(2, '0');
            const minStr = minutes.toString().padStart(2, '0');
            const period = isAm ? 'AM' : 'PM';

            timeDisplay.textContent = `${hourStr}:${minStr} ${period}`;
            clockHand.style.transform = `translateX(-50%) rotate(${currentAngle}deg)`;
        }

        function handleMove(e) {
            if (!isDragging) return;
            
            const rect = clockContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            const deltaX = clientX - centerX;
            const deltaY = clientY - centerY;
            
            let angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI) + 90;
            
            // Continuous rotation logic
            currentAngle = angle;
            updateTime();
        }

        clockContainer.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', handleMove);

        clockContainer.addEventListener('touchstart', (e) => {
            isDragging = true;
            e.preventDefault();
        }, { passive: false });
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', handleMove, { passive: false });

        btnAm.addEventListener('click', () => {
            isAm = true;
            btnAm.classList.add('bg-secondary', 'text-on-secondary');
            btnAm.classList.remove('text-on-surface-variant');
            btnPm.classList.remove('bg-secondary', 'text-on-secondary');
            btnPm.classList.add('text-on-surface-variant');
            updateTime();
        });

        btnPm.addEventListener('click', () => {
            isAm = false;
            btnPm.classList.add('bg-secondary', 'text-on-secondary');
            btnPm.classList.remove('text-on-surface-variant');
            btnAm.classList.remove('bg-secondary', 'text-on-secondary');
            btnAm.classList.add('text-on-surface-variant');
            updateTime();
        });

        // Initialize display
        updateTime();
    </script>
</body></html>
