<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1418;
        }
        .bottom-sheet-gradient {
            background: linear-gradient(180deg, rgba(18, 46, 33, 1) 0%, rgba(11, 36, 24, 1) 100%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #424844;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#728d7d",
                        "surface-tint": "#b1cdbb",
                        "on-tertiary-container": "#f54647",
                        "inverse-on-surface": "#2c3136",
                        "surface-container-low": "#171c20",
                        "surface-container": "#1b2025",
                        "surface-container-highest": "#31353a",
                        "surface-container-high": "#262a2f",
                        "secondary": "#d8ff7f",
                        "on-tertiary-fixed": "#410004",
                        "on-tertiary-fixed-variant": "#930014",
                        "on-secondary-fixed-variant": "#394d00",
                        "on-error": "#690005",
                        "on-secondary": "#263500",
                        "surface-dim": "#0f1418",
                        "secondary-fixed": "#bcf520",
                        "secondary-fixed-dim": "#a3d800",
                        "primary-container": "#0b2418",
                        "surface-bright": "#353a3e",
                        "surface": "#0f1418",
                        "on-primary": "#1d3528",
                        "error-container": "#93000a",
                        "inverse-primary": "#4a6455",
                        "on-surface-variant": "#c2c8c2",
                        "inverse-surface": "#dfe3e9",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "on-secondary-container": "#4a6400",
                        "on-primary-fixed-variant": "#334c3e",
                        "outline": "#8c928d",
                        "on-tertiary": "#68000b",
                        "on-secondary-fixed": "#151f00",
                        "tertiary-container": "#480005",
                        "on-surface": "#dfe3e9",
                        "on-primary-fixed": "#072014",
                        "surface-variant": "#31353a",
                        "surface-container-lowest": "#0a0f13",
                        "secondary-container": "#afe700",
                        "error": "#ffb4ab",
                        "outline-variant": "#424844",
                        "on-background": "#dfe3e9",
                        "primary-fixed-dim": "#b1cdbb",
                        "primary-fixed": "#cde9d6",
                        "background": "#0f1418",
                        "tertiary-fixed": "#ffdad7",
                        "tertiary": "#ffb3ae",
                        "primary": "#b1cdbb",
                        "on-error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "2rem",
                        "stack-md": "1rem",
                        "container-margin": "1.5rem",
                        "stack-sm": "0.5rem",
                        "gutter": "1rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-status": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-status": ["12px", {"lineHeight": "16px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col overflow-hidden">
<!-- Mock Background: Schedule Screen (Dimmed) -->
<main class="flex-1 p-6 opacity-30 pointer-events-none">
<header class="flex justify-between items-center mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-secondary">GõClock</h1>
<div class="w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant"></div>
</header>
<div class="space-y-4">
<div class="h-20 bg-surface-container-low rounded-xl border border-outline-variant p-4 flex items-center gap-4">
<div class="w-1 h-full bg-secondary rounded-full"></div>
<div class="flex-1">
<div class="h-4 w-32 bg-surface-container-highest rounded-full mb-2"></div>
<div class="h-3 w-20 bg-surface-container-high rounded-full"></div>
</div>
</div>
<div class="h-20 bg-surface-container-low rounded-xl border border-outline-variant p-4 flex items-center gap-4">
<div class="w-1 h-full bg-error rounded-full"></div>
<div class="flex-1">
<div class="h-4 w-40 bg-surface-container-highest rounded-full mb-2"></div>
<div class="h-3 w-24 bg-surface-container-high rounded-full"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Sheet Overlay -->
<div class="fixed inset-0 bg-black/60 z-40 backdrop-blur-sm"></div>
<!-- Bottom Sheet Content -->
<div class="fixed bottom-0 left-0 right-0 h-[75%] bottom-sheet-gradient rounded-t-[32px] z-50 flex flex-col shadow-2xl border-t border-outline-variant">
<!-- Drag Handle -->
<div class="flex justify-center pt-3 pb-2">
<div class="w-10 h-1.5 bg-outline-variant rounded-full opacity-50"></div>
</div>
<!-- Header -->
<div class="flex justify-between items-center px-6 py-4 border-b border-outline-variant/30">
<button class="text-on-surface-variant font-body-lg text-body-lg active:scale-95 transition-transform">Hủy</button>
<h2 class="font-headline-md text-headline-md text-on-surface">Thêm mới</h2>
<button class="bg-secondary text-on-secondary px-5 py-1.5 rounded-full font-label-status text-label-status shadow-lg active:scale-95 transition-transform">Lưu</button>
</div>
<!-- Scrollable Body -->
<div class="flex-1 overflow-y-auto px-6 pt-6 pb-24 custom-scrollbar">
<!-- Segmented Control Navigation -->
<div class="bg-surface-container-lowest p-1 rounded-xl flex gap-1 mb-8 border border-outline-variant/20">
<button class="flex-1 py-2.5 rounded-lg bg-secondary text-on-secondary font-label-status text-label-status flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]">menu_book</span>
                    Lịch học
                </button>
<button class="flex-1 py-2.5 rounded-lg text-on-surface-variant font-label-status text-label-status flex items-center justify-center gap-2 hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined text-[18px]">push_pin</span>
                    Bài tập
                </button>
</div>
<div class="space-y-6">
<!-- Tên môn học -->
<div class="space-y-2">
<label class="text-on-surface-variant font-label-caps text-label-caps uppercase">Tên môn học</label>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-4 text-headline-md font-headline-md text-secondary placeholder:text-on-surface-variant/30 focus:ring-2 focus:ring-secondary/50 focus:border-secondary outline-none transition-all" placeholder="Ví dụ: Toán rời rạc" type="text"/>
</div>
<!-- Màu sắc hiển thị -->
<div class="space-y-3">
<label class="text-on-surface-variant font-label-caps text-label-caps uppercase">Màu sắc hiển thị</label>
<div class="flex justify-between items-center bg-surface-container-low p-4 rounded-xl border border-outline-variant/30">
<button class="w-8 h-8 rounded-full bg-secondary ring-2 ring-offset-2 ring-offset-primary-container ring-secondary"></button>
<button class="w-8 h-8 rounded-full bg-blue-400 hover:scale-110 transition-transform"></button>
<button class="w-8 h-8 rounded-full bg-purple-400 hover:scale-110 transition-transform"></button>
<button class="w-8 h-8 rounded-full bg-rose-400 hover:scale-110 transition-transform"></button>
<button class="w-8 h-8 rounded-full bg-orange-400 hover:scale-110 transition-transform"></button>
<button class="w-8 h-8 rounded-full bg-teal-400 hover:scale-110 transition-transform"></button>
</div>
</div>
<!-- Khung thời gian -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-on-surface-variant font-label-caps text-label-caps uppercase">Bắt đầu</label>
<div class="flex items-center gap-3 bg-surface-container-low p-4 rounded-xl border border-outline-variant/30 group active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-secondary">schedule</span>
<span class="font-headline-md text-headline-md">08:00</span>
</div>
</div>
<div class="space-y-2">
<label class="text-on-surface-variant font-label-caps text-label-caps uppercase">Kết thúc</label>
<div class="flex items-center gap-3 bg-surface-container-low p-4 rounded-xl border border-outline-variant/30 group active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-on-surface-variant">schedule</span>
<span class="font-headline-md text-headline-md">10:30</span>
</div>
</div>
</div>
<!-- Chu kỳ lặp lại -->
<div class="space-y-2">
<label class="text-on-surface-variant font-label-caps text-label-caps uppercase">Chu kỳ lặp lại</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-secondary/50 focus:border-secondary outline-none">
<option selected="">Hàng tuần</option>
<option>Hàng ngày</option>
<option>Thứ 2 đến Thứ 6</option>
<option>Tùy chỉnh</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Kết thúc lặp lại -->
<div class="space-y-4 bg-surface-container-low/40 p-4 rounded-2xl border border-secondary/10">
<div class="flex justify-between items-center">
<span class="text-on-surface font-body-lg text-body-lg">Kết thúc sau</span>
<div class="flex items-center gap-4 bg-surface-container-highest rounded-full px-2 py-1 border border-outline-variant/50">
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-headline-md text-headline-md w-16 text-center text-secondary">12 <span class="text-[12px] text-on-surface-variant font-normal">tuần</span></span>
<button class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
<div class="h-[1px] bg-outline-variant/20"></div>
<div class="flex justify-between items-center py-1">
<span class="text-on-surface font-body-lg text-body-lg">Ngày cụ thể</span>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="text-body-sm font-body-sm">Chọn ngày</span>
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
</div>
<!-- Nhắc nhở -->
<div class="space-y-2">
<label class="text-on-surface-variant font-label-caps text-label-caps uppercase">Nhắc nhở</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-secondary/50 focus:border-secondary outline-none">
<option>Không nhắc</option>
<option>Khi bắt đầu</option>
<option>Trước 5 phút</option>
<option selected="">Trước 15 phút</option>
<option>Trước 30 phút</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">notifications_active</span>
</div>
</div>
<!-- Spacer for scroll -->
<div class="h-8"></div>
</div>
</div>
<!-- Sticky Action Indicator (Decorative) -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-on-surface-variant/20 rounded-full"></div>
</div>
<!-- Script for simple micro-interactions -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Add a small haptic-like bounce if possible, or just log
                console.log('Action performed: ' + this.innerText.trim());
            });
        });

        // Basic selection logic for color dots
        const dots = document.querySelectorAll('.rounded-full.w-8.h-8');
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                dots.forEach(d => d.classList.remove('ring-2', 'ring-offset-2', 'ring-offset-primary-container', 'ring-secondary'));
                dot.classList.add('ring-2', 'ring-offset-2', 'ring-offset-primary-container', 'ring-secondary');
            });
        });
    </script>
</body></html>
